# Mutual on a computer you already own, with no cloud account and no credit card.
# Skips Caddy entirely: a tunnel (ngrok, see docs/DEPLOYMENT.md §3a) terminates HTTPS and
# forwards to this container over plain HTTP on localhost.
#
#   cd server/deploy
#   cp env.example .env                          # then fill it in (no MUTUAL_DOMAIN needed)
#   cp config.prod.example.yaml config.yaml
#   docker compose -f docker-compose.selfhost.yml up -d --build
services:
  mutual:
    build:
      context: ../..
      dockerfile: server/deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MUTUAL_CONFIG: /data/config.yaml
      # The port below is published to 127.0.0.1 only, so the one process that can ever
      # connect is the tunnel agent running on this same machine -- the same reasoning
      # docker-compose.yml uses to trust "*" for the Caddy-only network. Docker's own
      # port-forwarding does not reliably present the peer address as 127.0.0.1 (it can
      # arrive from an internal bridge address instead), so pinning to that literal
      # value here would silently stop the rate limiter from trusting the tunnel at all.
      MUTUAL_FORWARDED_ALLOW_IPS: "*"
    volumes:
      - mutual-data:/data
      - ./config.yaml:/data/config.yaml:ro
    ports:
      # Bound to loopback only: reachable from this machine (where the tunnel agent
      # runs), never directly from the network. The tunnel is the only path in.
      - "127.0.0.1:8000:8000"

volumes:
  mutual-data:
