# Simulation parameters (SPEC.md §15). Every value below is either a plain
# modelling assumption (no empirical source — chosen for a plausible, legible
# effect size) or a literature-informed range, marked on each line. All
# conclusions drawn from this model are conditional on these assumptions
# (sim/mutual_sim/report.py states this up front).

# --- Population (§15.1) -----------------------------------------------------
N: 600                        # assumption: a mid-size campus cohort
n_hostels: 6                  # assumption
n_departments: 8              # assumption
compatibility_dim: 8          # assumption: enough dimensions that cosine similarity is informative
activity_alpha: 2             # literature-informed: Beta(2,2), symmetric, mean 0.5 (moderate daily activity)
activity_beta: 2              # literature-informed: Beta(2,2)
date_openness_prob: 0.6       # assumption: §4's "date" is one of five intents; most but not all students
                               # are open to it. Modelling choice (documented in docs/DECISIONS_LOG.md #17):
                               # this simulation models the *date* channel only, since that is what reveal-policy
                               # timing is centrally about (RQ2); an agent with date_openness=false never signals
                               # or is signalled on this channel, but still appears as a crossing partner for others.

# --- Co-presence (§15.2): stochastic block model daily crossing probabilities
sbm_same_hostel: 0.05          # assumption: dorm-mates cross often
sbm_same_department: 0.02     # assumption: classmates cross somewhat often
sbm_otherwise: 0.002           # assumption: strangers rarely cross
# A pair that is both same-hostel and same-department uses the hostel weight
# (the higher of the two in this config); see copresence.py.

# --- Discovery and signalling (§15.3) ---------------------------------------
beta_a: 1.0                   # assumption: weight on visual attractiveness in utility
beta_c: 1.0                   # assumption: weight on compatibility in utility
tau: 0.5                      # assumption: signalling threshold (utility must clear this to signal)
K: 20                         # literature-informed, independent of the app: constants.json's signal_set_size
                              # was lowered to 7 on 2026-10-09 (SPEC D14); K stays 20 because sim/results/
                              # was already generated at this value, and changing it would mean either
                              # re-running the whole study or letting the committed figures drift from the
                              # config that produced them (CLAUDE.md §8 rule 4). Revisit together if the
                              # study is re-run.
display_cap: 40               # literature-informed: mirrors server/config.example.yaml digest.display_cap
interest_ttl_days: 7          # literature-informed: mirrors server/config.example.yaml signals.interest_ttl_days

# --- Matching, conversation, reveal (§15.4) ---------------------------------
n_reveal: 8                   # literature-informed: mirrors reveal.conversation_messages_each
gamma_a: 1.0                  # assumption: weight on the other's attractiveness in the reveal continue/drop decision
gamma_c: 1.0                  # assumption: weight on compatibility in the reveal continue/drop decision
gamma_0: 0.5                  # assumption: baseline continuation bias (slightly positive: most people who
                               # reach a reveal moment are at least a little invested)
delta: 0.5                    # assumption: how much conversational investment (policy C) dampens the
                               # appearance term at reveal; progress=1 under C, 0 under M/P (see behaviour.py)
phi: 0.02                     # assumption: frustration added per pre-reveal round under C ("irritated by not
                               # seeing faces")

# --- Churn (§15.5) -----------------------------------------------------------
h_0: 0.01                     # assumption: baseline daily churn probability
h_f: 0.05                     # assumption: churn sensitivity to accumulated frustration
h_m: 0.02                     # assumption: churn reduction per recent match (engagement effect)
recent_matches_window_days: 7  # assumption: "recent" = matches formed in the trailing 7 days (mirrors
                               # interest_ttl_days as the model's one other natural time horizon)

# --- Run (§15.6, §15.7) ------------------------------------------------------
T: 56                         # SPEC §15.6: 56-day run
policies: ["P", "M", "C"]
seeds_main: 30                # SPEC §15.7: seeds 0..29 for the main experiment
retention_checkpoints: [28, 56]

bootstrap:
  resamples: 10000            # SPEC §15.7: 95% percentile bootstrap, 10 000 resamples
  ci: 0.95
  seed: 0                     # seeds the resampling itself, independent of the per-run seeds above

sweep:
  beta_a_over_beta_c: [0, 0.5, 1, 2, 4]   # SPEC §15.7 (beta_c held at 1.0; beta_a = ratio * beta_c)
  phi: [0, 0.02, 0.08]
  K: [5, 10, 20]
  seeds_per_cell: 30
  seed_start: 1000            # SPEC §15.7: the sweep uses seeds 1000+
