# Fast checks before every commit. Activate the venv first: .venv\Scripts\Activate.ps1
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      # pytest exits with code 5 when it collects no tests (true until Phase 1);
      # treat that as a pass, and any other non-zero code as a failure.
      - id: pytest-protocol
        name: pytest packages/protocol_py (fast)
        entry: python -c "import sys, pytest; code = pytest.main(['packages/protocol_py', '-q']); sys.exit(0 if code == 5 else code)"
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-server
        name: pytest server
        entry: python -m pytest server -q -p no:warnings
        language: system
        pass_filenames: false
        files: ^(server|packages/protocol_py|packages/protocol-spec)/

      - id: pytest-sim
        name: pytest sim
        entry: python -m pytest sim -q -p no:warnings
        language: system
        pass_filenames: false
        files: ^sim/

      # Cross-language guard: any change to the protocol or its vectors re-runs the TS suite.
      - id: protocol-ts
        name: npm test -w packages/protocol-ts (vectors + properties)
        entry: npm test -w packages/protocol-ts
        language: system
        pass_filenames: false
        files: ^packages/(protocol-ts|protocol-spec|protocol_py)/

      # App hooks (added Phase 8). They run only when app/ or the protocol changes, because
      # eslint and jest on the React Native tree are the slowest checks in the repo.
      - id: app-lint
        name: npm run lint -w app
        entry: npm run lint -w app
        language: system
        pass_filenames: false
        files: ^app/

      - id: app-test
        name: npm test -w app
        entry: npm test -w app
        language: system
        pass_filenames: false
        files: ^(app|packages/protocol-ts|packages/protocol-spec)/

      - id: app-typecheck
        name: npm run typecheck -w app
        entry: npm run typecheck -w app
        language: system
        pass_filenames: false
        files: ^app/

      # The two privacy scripts (AC-T2-3, AC-T2-4). check:privacy also scans every
      # package.json in the repo for a denylisted SDK, so it always runs.
      - id: app-check-privacy
        name: npm run check:privacy -w app
        entry: npm run check:privacy -w app
        language: system
        pass_filenames: false
        always_run: true

      - id: app-check-contrast
        name: npm run check:contrast -w app
        entry: npm run check:contrast -w app
        language: system
        pass_filenames: false
        files: ^app/
